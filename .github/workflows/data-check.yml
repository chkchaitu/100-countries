name: Weekly data check
on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths: ['data/**','scripts/**']
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate data (fails the run on schema errors)
        run: python3 scripts/check_data.py
      - name: Links and news (weekly or manual only)
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/check_data.py --links || true
          python3 scripts/news_watch.py || true
          python3 scripts/report.py
      - name: Publish report as an issue
        if: github.event_name != 'pull_request'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh label create data-check --color 0e8a16 2>/dev/null || true
          gh issue create --title "Weekly data check $(date +%F)" --label data-check --body-file report.md
